name: remote test (ZeroTier VPN)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [remote-test-ZeroTier VPN]

jobs:
  minecraft:
    runs-on: windows-latest

    steps:
      - name: 安裝 ZeroTier CLI
        shell: pwsh
        run: |
          $success = $false
          for ($i = 1; $i -le 5; $i++) {
              Write-Host "Attempt $i to install ZeroTier..."
              winget install --id ZeroTier.ZeroTierOne -e --source winget --accept-package-agreements --accept-source-agreements
              if ($LASTEXITCODE -eq 0) {
                  $success = $true
                  break
              }
              Write-Host "Retrying in 5 seconds..."
              Start-Sleep -Seconds 5
          }

          if (-not $success) {
              Write-Error "❌ Failed to install ZeroTier"
              exit 1
          }
      - name: 加入 ZeroTier 網路
        shell: powershell
        env:
          ZT_NETWORK_ID: ${{ secrets.ZEROTIER_NETWORK_ID }}
        run: |
          $ztCli = 'C:\Program Files (x86)\ZeroTier\One\zerotier-cli.exe'

          if (Test-Path 'C:\Program Files (x86)\ZeroTier\One') {
              $env:PATH += ';C:\Program Files (x86)\ZeroTier\One'
          }

          Write-Host "Checking ZeroTier service status..."
          $serviceStarted = $false
          for ($i = 1; $i -le 10; $i++) {
            $info = & $ztCli info 2>$null
            if ($LASTEXITCODE -eq 0) {
                Write-Host "ZeroTier service is running."
                $serviceStarted = $true
                break
            }
            Write-Host "Waiting for ZeroTier service to start... ($i/10)"
            Start-Sleep -Seconds 2
          }

          if (-not $serviceStarted) {
              Write-Error "ZeroTier service failed to start."
              exit 1
          }

          Write-Host "Joining ZeroTier network: $env:ZT_NETWORK_ID"
          & $ztCli join $env:ZT_NETWORK_ID
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to join ZeroTier network."
              exit 1
          }

          Write-Host "Waiting for ZeroTier connection OK status..."
          $joined = $false
          for ($i = 1; $i -le 20; $i++) {
              $netInfo = & $ztCli listnetworks | Select-String -Pattern $env:ZT_NETWORK_ID
              Write-Host "Network status: $netInfo"
            
              if ($netInfo -match 'OK') {
                  Write-Host "Successfully joined ZeroTier network!"
                  $joined = $true
                  break
              }
              Start-Sleep -Seconds 3
          }

          if (-not $joined) {
              Write-Error "Timeout waiting for ZeroTier OK status."
              exit 1
          }
      - name: 顯示 ZeroTier 身份檔案（只用一次）
        shell: powershell
        run: |
          $secretPath = "C:\ProgramData\ZeroTier\One\identity.secret"
          Write-Host "========== BEGIN identity.secret =========="
          if (Test-Path $secretPath) {
              Get-Content $secretPath
          } else {
              Write-Error "找不到 ZeroTier 身份檔案：$secretPath"
          }
          Write-Host "=========== END identity.secret ==========="

      - name: 維持虛擬機運行 1 小時
        shell: powershell
        run: |
          $totalMinutes = 60
          $intervalMinutes = 5
          $totalIterations = $totalMinutes / $intervalMinutes
          $ztCli = "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.exe"

          Write-Host "🚀 開始維持虛擬機運行 1 小時..."

          for ($i = 1; $i -le $totalIterations; $i++) {
              $currentTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              $status = & $ztCli info 2>$null
            
              # 每 5 分鐘印出一次狀態以維持連線，並防止 GitHub Actions 無輸出超時 (No Output Timeout)
              Write-Host "[$currentTime] ($($i * $intervalMinutes)/$totalMinutes 分鐘) 虛擬機運作中... ZeroTier 狀態: $status"
            
              Start-Sleep -Seconds ($intervalMinutes * 60)
          }

          Write-Host "✅ 1 小時運行任務結束，準備關閉虛擬機。"
