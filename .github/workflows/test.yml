name: remote test (ZeroTier VPN)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [remote-test-ZeroTier VPN]

jobs:
  minecraft:
    runs-on: windows-latest

    steps:
      - name: 設定虛擬機管理員密碼
        shell: pwsh
        env:
          RDP_PWD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:RDP_PWD) {
            Write-Error "❌ 未設定 RDP_PASSWORD 機密！"
            exit 1
          }
          $Password = ConvertTo-SecureString $env:RDP_PWD -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
          Write-Host "✅ 已成功設定 runneradmin 的登入密碼！"

      - name: 切換系統語言為繁體中文 (zh-TW)
        shell: pwsh
        run: |
          Write-Host "🌐 開始安裝並切換繁體中文語言包 (zh-TW)..."

          Set-Culture -CultureInfo "zh-TW"
          Set-WinSystemLocale -SystemLocale "zh-TW"
          Set-WinHomeLocation -GeoId 237 # 237 為台灣的 GeoID
          Set-WinUILanguageOverride -Language "zh-TW" -ErrorAction SilentlyContinue

          Write-Host "✅ 繁體中文語言設定已完成！"

      - name: 開啟RDP
        shell: pwsh
        env:
          RDP_PORT: ${{ secrets.RDP_PORT }}
        run: |
          # 1. 修改機碼，開啟 RDP 功能
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          # 2. 開放 Windows 防火牆的 RDP 連接埠 (3389)
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          # 3. 關閉系統自動睡眠（確保掛機不休眠）
          powercfg /change standby-timeout-ac 0

      - name: Step 1 - 使用 Chocolatey 安裝 ZeroTier
        shell: pwsh
        run: |
          Write-Host "⚙️ 使用 choco 安裝 ZeroTier..."
          choco install zerotier-one -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Chocolatey 安裝 ZeroTier 失敗"
            exit 1
          }
          Write-Host "✅ ZeroTier 安裝完成！"

      - name: 匯入 ZeroTier 身份檔案（保證固定 IP）
        shell: pwsh
        env:
          ZT_SECRET: ${{ secrets.ZT_IDENTITY_SECRET }}
        run: |
          Write-Host "🛑 停止 ZeroTier 服務..."
          Stop-Service -Name "ZeroTierOneService" -Force -ErrorAction SilentlyContinue

          $ztDir = "C:\ProgramData\ZeroTier\One"
          if (-not (Test-Path $ztDir)) {
            New-Item -ItemType Directory -Path $ztDir -Force | Out-Null
          }

          $secretPath = Join-Path $ztDir "identity.secret"
          $publicPath = Join-Path $ztDir "identity.public"

          # 寫入私鑰檔案
          Write-Host "🔑 寫入 identity.secret..."
          Set-Content -Path $secretPath -Value $env:ZT_SECRET -Encoding utf8

          # 清除舊的 public 檔以利後續驗證生成
          if (Test-Path $publicPath) {
            Remove-Item -Path $publicPath -Force
          }

          Write-Host "🚀 啟動 ZeroTier 服務..."
          Start-Service -Name "ZeroTierOneService"

          Write-Host "⏳ 等待 identity.public 自動生成..."
          $generated = $false
          for ($i = 1; $i -le 10; $i++) {
            if (Test-Path $publicPath) {
              Write-Host "✅ identity.public 已成功生成！"
              $generated = $true
              break
            }
            Write-Host "⏳ 尚未出現，等待 1 秒... ($i/10)"
            Start-Sleep -Seconds 1
          }

          if ($generated) {
            Write-Host "目前身份 (identity.public)："
            Get-Content $publicPath
          } else {
            Write-Warning "⚠️ 無法讀取 identity.public 或檔案尚未生成"
          }

      - name: Step 2 - 加入 ZeroTier 網路
        shell: pwsh
        env:
          ZT_NETWORK_ID: ${{ secrets.ZEROTIER_NETWORK_ID }}
        run: |
          $ztExe = "C:\ProgramData\ZeroTier\One\zerotier-one_x64.exe"

          Write-Host "✅ 檢查 ZeroTier 服務狀態..."
          $serviceStarted = $false
          for ($i = 1; $i -le 15; $i++) {
            $info = & $ztExe -q info 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ ZeroTier 服務已啟動，狀態：$info"
              $serviceStarted = $true
              break
            }
            Write-Host "⏳ 等待 ZeroTier 服務啟動... ($i/15)"
            Start-Sleep -Seconds 3
          }

          if (-not $serviceStarted) {
            Write-Error "❌ ZeroTier 服務未能成功啟動"
            exit 1
          }

          Write-Host "🚀 嘗試加入 ZeroTier 網路：$env:ZT_NETWORK_ID"
          & $ztExe -q join $env:ZT_NETWORK_ID
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ 加入 ZeroTier 網路失敗"
            exit 1
          }

          Write-Host "🕓 等待 ZeroTier 成功連線..."
          $joined = $false
          for ($i = 1; $i -le 20; $i++) {
            $netInfo = & $ztExe -q listnetworks | Select-String -Pattern $env:ZT_NETWORK_ID
            Write-Host "網路狀態：$netInfo"
          
            if ($netInfo -match 'OK') {
              Write-Host "✅ 已成功加入 ZeroTier 網路！"
              $joined = $true
              break
            }
            Start-Sleep -Seconds 3
          }

          if (-not $joined) {
            Write-Error "❌ 連線逾時，未能取得 OK 狀態"
            exit 1
          }
          
      - name: 顯示 ZeroTier 身份檔案（只用一次）
        shell: pwsh
        run: |
          $secretPath = "C:\ProgramData\ZeroTier\One\identity.secret"
          Write-Host "========== BEGIN identity.secret =========="
          if (Test-Path $secretPath) {
              Get-Content $secretPath
          } else {
              Write-Error "找不到 ZeroTier 身份檔案：$secretPath"
          }
          Write-Host "=========== END identity.secret ==========="

      - name: Step 3 - 待機 30 分鐘
        shell: pwsh
        run: |
          Write-Host "🚀 開始待機 30 分鐘..."
          Start-Sleep -Seconds 1800
          Write-Host "✅ 30 分鐘待機結束，準備關閉虛擬機。"
