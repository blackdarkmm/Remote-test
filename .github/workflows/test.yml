name: remote test (ZeroTier VPN)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [remote-test-ZeroTier VPN]

jobs:
  minecraft:
    runs-on: windows-latest

    steps:
      - name: Step 1 - 使用 Chocolatey 安裝 ZeroTier
        shell: pwsh
        run: |
          Write-Host "⚙️ 使用 choco 安裝 ZeroTier..."
          choco install zerotier-one -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Chocolatey 安裝 ZeroTier 失敗"
            exit 1
          }
          Write-Host "✅ ZeroTier 安裝完成！"

      - name: Step 2 - 搜尋安裝路徑並設定環境變數
        shell: pwsh
        run: |
          $exeName = "zerotier-cli.exe"
          $possibleDirs = @(
            "C:\Program Files (x86)\ZeroTier\One",
            "C:\Program Files\ZeroTier\One",
            "C:\ProgramData\ZeroTier\One"
          )

          $targetExePath = $null

          # 優先方案：重試檢查預設目錄 (最多等 30 秒)
          for ($i = 1; $i -le 10; $i++) {
            Write-Host "⏳ 檢查預設安裝路徑 (第 $i/10 次嘗試)..."
            foreach ($dir in $possibleDirs) {
              $checkPath = Join-Path $dir $exeName
              if (Test-Path $checkPath) {
                $targetExePath = $checkPath
                break
              }
            }

            if ($targetExePath) { break }
            Start-Sleep -Seconds 3
          }

          # 備用方案：若預設目錄找不到，對 C 磁碟進行全域搜尋
          if (-not $targetExePath) {
            Write-Host "⚠️ 預設目錄未找到，啟動 C 磁碟全域搜尋 $exeName..."
            $foundFile = Get-ChildItem -Path "C:\" -Filter $exeName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundFile) {
              $targetExePath = $foundFile.FullName
            }
          }
  
          if (-not $targetExePath) {
            Write-Error "❌ 全域搜尋完成，仍無法找到 $exeName，請確認 MSI 是否安裝成功。"
            exit 1
          }

          $installedDir = Split-Path -Path $targetExePath -Parent
          Write-Host "🎉 成功定位 ZeroTier 執行檔！完整路徑：$targetExePath"
          
      - name: 加入 ZeroTier 網路
        shell: pwsh
        env:
          ZT_NETWORK_ID: ${{ secrets.ZEROTIER_NETWORK_ID }}
        run: |
          
          # 自動尋找 zerotier-cli 執行檔（雙重備援）
          $ztCmd = Get-Command zerotier-cli -ErrorAction SilentlyContinue
          if ($ztCmd) {
            $ztCli = $ztCmd.Source
          } else {
            # 如果 PATH 依然未即時套用，手動檢查預設路徑
            $fallbackPaths = @(
              "C:\Program Files\ZeroTier\One\zerotier-cli.exe",
              "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.exe"
            )
            $ztCli = $fallbackPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $ztCli) {
            Write-Error "❌ 系統中找不到 zerotier-cli 指令或檔案"
            exit 1
          }

          Write-Host "✅ 自動偵測到 ZeroTier CLI 路徑：$ztCli"

          Write-Host "✅ 檢查 ZeroTier 服務是否啟動..."
          $serviceStarted = $false
          for ($i = 1; $i -le 15; $i++) {
            $info = & $ztCli info 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ ZeroTier 服務已啟動，狀態：$info"
              $serviceStarted = $true
              break
            }
            Write-Host "⏳ 等待 ZeroTier 服務啟動... ($i/15)"
            Start-Sleep -Seconds 3
          }

          if (-not $serviceStarted) {
            Write-Error "❌ ZeroTier 服務未能成功啟動"
            exit 1
          }

          Write-Host "🚀 嘗試加入 ZeroTier 網路：$env:ZT_NETWORK_ID"
          & $ztCli join $env:ZT_NETWORK_ID
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ 加入 ZeroTier 網路失敗"
            exit 1
          }

          Write-Host "🕓 等待 ZeroTier 成功連線..."
          $joined = $false
          for ($i = 1; $i -le 20; $i++) {
            $netInfo = & $ztCli listnetworks | Select-String -Pattern $env:ZT_NETWORK_ID
            Write-Host "網路狀態詳細資訊：$netInfo"
          
            if ($netInfo -match 'OK') {
              Write-Host "✅ 已成功加入 ZeroTier 網路！"
              $joined = $true
              break
            }
            Start-Sleep -Seconds 3
          }

          if (-not $joined) {
            Write-Error "❌ 等待逾時，未能成功獲得 OK 狀態"
            exit 1
          }
          
      - name: 顯示 ZeroTier 身份檔案（只用一次）
        shell: powershell
        run: |
          $secretPath = "C:\ProgramData\ZeroTier\One\identity.secret"
          Write-Host "========== BEGIN identity.secret =========="
          if (Test-Path $secretPath) {
              Get-Content $secretPath
          } else {
              Write-Error "找不到 ZeroTier 身份檔案：$secretPath"
          }
          Write-Host "=========== END identity.secret ==========="

      - name: 維持虛擬機運行 1 小時
        shell: powershell
        run: |
          $totalMinutes = 60
          $intervalMinutes = 5
          $totalIterations = $totalMinutes / $intervalMinutes
          $ztCli = "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.exe"

          Write-Host "🚀 開始維持虛擬機運行 1 小時..."

          for ($i = 1; $i -le $totalIterations; $i++) {
              $currentTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              $status = & $ztCli info 2>$null
            
              # 每 5 分鐘印出一次狀態以維持連線，並防止 GitHub Actions 無輸出超時 (No Output Timeout)
              Write-Host "[$currentTime] ($($i * $intervalMinutes)/$totalMinutes 分鐘) 虛擬機運作中... ZeroTier 狀態: $status"
            
              Start-Sleep -Seconds ($intervalMinutes * 60)
          }

          Write-Host "✅ 1 小時運行任務結束，準備關閉虛擬機。"
