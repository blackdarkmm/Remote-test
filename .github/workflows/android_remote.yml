name: Redroid Android with ZeroTier & scrcpy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [remote-test-ZeroTier VPN]

jobs:
  redroid-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1. 安裝並配置 ZeroTier 網路連線
      # -------------------------------------------------------------
      - name: Install ZeroTier & ADB Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl android-tools-adb
          curl -s https://install.zerotier.com | sudo bash

      - name: Import ZeroTier Identity (保證固定 IP)
        env:
          ZT_SECRET: ${{ secrets.ZT_IDENTITY_SECRET }}
        run: |
          sudo systemctl stop zerotier-one || true
          sudo mkdir -p /var/lib/zerotier-one
          
          # 寫入私鑰檔案
          echo "$ZT_SECRET" | sudo tee /var/lib/zerotier-one/identity.secret > /dev/null
          sudo rm -f /var/lib/zerotier-one/identity.public
          
          sudo systemctl start zerotier-one
          sleep 3

      - name: Join ZeroTier Network
        env:
          ZT_NETWORK_ID: ${{ secrets.ZEROTIER_NETWORK_ID }}
        run: |
          echo "🚀 加入 ZeroTier 網路: $ZT_NETWORK_ID"
          sudo zerotier-cli join $ZT_NETWORK_ID
          
          # 等待取得 OK 狀態
          for i in {1..20}; do
            STATUS=$(sudo zerotier-cli listnetworks | grep $ZT_NETWORK_ID | awk '{print $5}')
            echo "ZeroTier 狀態: $STATUS ($i/20)"
            if [ "$STATUS" == "OK" ]; then
              echo "✅ 已成功加入 ZeroTier 網路！"
              break
            fi
            sleep 3
          done

      # -------------------------------------------------------------
      # 2. 啟用 Binder 模組並啟動 Redroid 容器
      # -------------------------------------------------------------
      - name: Build & Load Redroid Binder for Kernel 6.17+
        run: |
          set -e
          echo "🌐 1. 安裝編譯依賴..."
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-$(uname -r) android-tools-adb

          rm -rf redroid-modules
          git clone https://github.com/remote-android/redroid-modules.git
          cd redroid-modules/binder

          # 強制還原程式碼至乾淨狀態
          git checkout binder.c binder_alloc.c binder_alloc.h

          echo "🛠️ 2. 建立相容性標頭檔 binder_compat.h..."
          cat << 'EOF' > binder_compat.h
          #ifndef _BINDER_COMPAT_H
          #define _BINDER_COMPAT_H

          #include <linux/file.h>
          #include <linux/fdtable.h>
          #include <linux/mm.h>
          #include <linux/security.h>
          #include <linux/cred.h>
          #include <linux/task_work.h>
          #include <linux/list_lru.h>
          #include <linux/shrinker.h>

          #ifndef CONFIG_ANDROID_BINDER_DEVICES
          #define CONFIG_ANDROID_BINDER_DEVICES "binder,hwbinder,vndbinder"
          #endif

          #ifndef CONFIG_ANDROID_BINDER_DEVICES_HACKED
          #define CONFIG_ANDROID_BINDER_DEVICES_HACKED CONFIG_ANDROID_BINDER_DEVICES
          #endif

          // 取消 pr_fmt 重定義警告
          #ifdef pr_fmt
          #undef pr_fmt
          #endif
          #define pr_fmt(fmt) KBUILD_MODNAME ": " fmt

          // 1. 安全與追蹤 API 覆寫
          #define security_binder_transfer_binder(from, to) 0
          #define security_binder_transfer_file(from, to, file) 0
          #define security_binder_transaction(from, to) 0
          #define security_binder_set_context_mgr(mgr) 0
          #define security_task_getsecid(p, secid) do { *(secid) = 0; } while(0)
          #define security_secid_to_secctx(secid, secctx, sz) -EOPNOTSUPP
          #define security_release_secctx(secctx, sz) do {} while(0)

          #define freezer_do_not_count() do {} while(0)
          #define freezer_count() do {} while(0)

          // 2. 替代已移除的 __close_fd_get_file
          static inline void binder_compat_close_fd(int fd, struct file **f) {
              *f = fget(fd);
              if (*f) close_fd(fd);
          }
          #define __close_fd_get_file(fd, f) binder_compat_close_fd(fd, f)

          // 3. mmap_sem 轉換為 mmap_lock
          #define down_read(sem) mmap_read_lock(mm)
          #define up_read(sem) mmap_read_unlock(mm)
          #define down_read_trylock(sem) mmap_read_trylock(mm)

          // 4. list_lru API 相容封裝
          #define list_lru_add(lru, item) list_lru_add(lru, item, 0, NULL)
          #define list_lru_del(lru, item) list_lru_del(lru, item, 0, NULL)

          // 5. 新版 Kernel 符號修復
          #define zap_page_range(vma, start, len) zap_page_range_single(vma, start, len, NULL)
          #define register_shrinker(...) 0
          #define unregister_shrinker(s) do {} while(0)
          static inline void binderfs_exit(void) {}

          #endif
          EOF

          echo "🛠️ 3. 引入相容檔與修復 API 語法..."
          # 在最開頭引入 compat 標頭檔
          sed -i '1i#include "binder_compat.h"' binder.c
          sed -i '1i#include "binder_compat.h"' binder_alloc.c

          # --- 修正 binder.c ---
          sed -i 's/vma->vm_flags |= VM_DONTCOPY | VM_MIXEDMAP;/vm_flags_set(vma, VM_DONTCOPY | VM_MIXEDMAP);/g' binder.c
          sed -i 's/vma->vm_flags &= ~VM_MAYWRITE;/vm_flags_clear(vma, VM_MAYWRITE);/g' binder.c
          sed -i 's/task_work_add(\([^,]*\), \([^,]*\), true)/task_work_add(\1, \2, TWA_RESUME)/g' binder.c
          sed -i 's/task_work_add(\([^,]*\), \([^,]*\), false)/task_work_add(\1, \2, TWA_RESUME)/g' binder.c

          # --- 修正 binder_alloc.h & binder_alloc.c ---
          # 1. 移除函數聲明與定義中的 spinlock_t 參數
          sed -i 's/spinlock_t \*lock,//g' binder_alloc.h
          sed -i 's/struct spinlock \*lock,//g' binder_alloc.h
          sed -i 's/spinlock_t \*lock,//g' binder_alloc.c
          sed -i 's/struct spinlock \*lock,//g' binder_alloc.c

          # 2. 移除 binder_alloc_free_page 中內部操作 spinlock 的舊代碼
          sed -i 's/spin_unlock(lock);/\/* spin_unlock(lock); *\//g' binder_alloc.c
          sed -i 's/spin_lock(lock);/\/* spin_lock(lock); *\//g' binder_alloc.c

          echo "🛠️ 4. 準備 Kbuild 配置..."
          cat << 'EOF' > Kbuild
          obj-m += binder_linux.o
          binder_linux-y := binder.o binder_alloc.o
          ccflags-y := -I$(src) -Wno-implicit-function-declaration -Wno-error -Wno-unused-variable -Wno-unused-but-set-variable
          EOF

          # 在 binder.c 補上 MODULE_DESCRIPTION 消除告警
          echo 'MODULE_DESCRIPTION("Android Binder Driver");' >> binder.c

          echo "🛠️ 5. 開始編譯..."
          make -C /lib/modules/$(uname -r)/build M=$PWD modules

          echo "🚀 6. 載入 binder_linux 核心模組..."
          sudo insmod binder_linux.ko devices="binder,hwbinder,vndbinder"
          sudo chmod 666 /dev/binder*

          echo "✅ 7. 啟動 Redroid 容器..."
          docker rm -f redroid 2>/dev/null || true

          docker run -itd \
            --name=redroid \
            --privileged \
            -v /dev/binder:/dev/binder \
            -v /dev/hwbinder:/dev/hwbinder \
            -v /dev/vndbinder:/dev/vndbinder \
            -v /data/redroid:/data \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.use_memfd=1

          echo "🔍 狀態確認："
          ls -l /dev/binder*
          docker ps -f name=redroid
          
      - name: Start Redroid Container
        run: |
          # 啟動 Redroid (Android 11) 容器
          # - android_fps=15: 降低幀率減少 CPU 負擔
          # - redroid.gpu.mode=guest: 使用 CPU 軟體渲染 (OpenGL ES 3.0)
          docker run -d \
            --name redroid \
            --privileged \
            --pull always \
            -p 5555:5555 \
            -v /data/redroid:/data \
            redroid/redroid:11.0.0-latest \
            android_fps=15 \
            redroid.gpu.mode=guest

      - name: Wait for Android Boot
        run: |
          echo "🔗 連線至本機 ADB..."
          adb connect 127.0.0.1:5555
          adb wait-for-device
          
          echo "⏳ 等待 Android 系統開機完成..."
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
            sleep 2
          done
          echo "✅ Redroid Android 系統已順利開機完畢！"

      # -------------------------------------------------------------
      # 3. 待機 120 分鐘 (提供 ZeroTier + ADB/scrcpy 遠端連線通道)
      # -------------------------------------------------------------
      - name: Keep-Alive for scrcpy Connection (120 Minutes)
        run: |
          echo "================================================="
          echo "🚀 Redroid 容器與 ZeroTier 服務已順利運作中！"
          echo "請從本地電腦透過 scrcpy 連線至遠端 ZeroTier IP"
          echo "================================================="
          sleep 7200
