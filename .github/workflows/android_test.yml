name: Run Redroid with Manual Binderfs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-redroid:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # ✨ 關鍵修正：不保留當前專案的臨時 Token 憑證，避免干擾後續公開倉庫的 clone
        persist-credentials: false

    - name: 編譯載入核心模組並啟動 Redroid 容器
      run: |
        echo "🌐 =========================================="
        echo "🌐 步驟 1：準備編譯環境..."
        echo "🌐 =========================================="
        sudo apt-get update
        sudo apt-get install -y linux-headers-$(uname -r) build-essential git

        echo -e "\n🌐 =========================================="
        echo "🌐 步驟 2：下載並編譯 redroid-modules..."
        echo "🌐 =========================================="
        # 🛠️ 強制修正：清除 Actions 的全局 Git 憑證，並在全新乾淨的環境下 clone
        git config --global --unset-all http.https://github.com || true
        
        # 透過指定空憑證與清空變數的方式進行 Clone
        git -c http.extraheader="" clone https://github.com/remote-android/redroid-modules
        
        # 針對當前 Linux 核心編譯 binder 驅動
        make -C /lib/modules/$(uname -r)/build M=$PWD EXTRA_CFLAGS="-DCONFIG_ANDROID_BINDERFS" binder_linux.ko
        
        echo -e "\n🌐 =========================================="
        echo "🌐 步驟 3：載入核心模組並驗證..."
        echo "🌐 =========================================="
        # 強制將驅動塞入核心，交由 binderfs 控管
        sudo insmod binder_linux.ko num_devices=0
        
        # 檢查系統是否已支援 binderfs
        if grep -q "binder" /proc/filesystems; then
          echo "✅ 核心已成功支援 binderfs 檔案系統！"
        else
          echo "❌ 核心模組載入失敗或未啟用 binderfs" && exit 1
        fi

        echo -e "\n🌐 =========================================="
        echo "🌐 步驟 4：建立並掛載內建的 binderfs..."
        echo "🌐 =========================================="
        sudo mkdir -p /dev/binderfs
        
        if ! mountpoint -q /dev/binderfs; then
            sudo mount -t binder binder /dev/binderfs
            echo "✅ binderfs 掛載成功！"
        else
            echo "ℹ️ binderfs 已經處於掛載狀態。"
        fi

        # 手動建立基礎節點，避免 GitHub 環境下的 udev 缺漏
        sudo touch /dev/binderfs/binder /dev/binderfs/hwbinder /dev/binderfs/vndbinder
        sudo chmod 777 /dev/binderfs/*

        echo -e "\n🌐 =========================================="
        echo "🌐 步驟 5：啟動 Redroid 容器 (使用 binderfs)..."
        echo "🌐 =========================================="
        # 清理可能存在的同名容器
        docker rm -f redroid 2>/dev/null || true

        # 啟動 Redroid 11 容器
        docker run -itd \
          --name=redroid \
          --privileged \
          -v /dev/binderfs:/dev/binderfs \
          -v /data/redroid:/data \
          -p 5555:5555 \
          redroid/redroid:11.0.0-latest \
          androidboot.use_memfd=1

        # 等待 5 秒讓 Docker 初始化
        sleep 5
        echo "✅ Redroid 容器已成功啟動！"

        echo -e "\n🔍 =========================================="
        echo "🔍 狀態檢查："
        echo "=============================================="
        echo "1. Binderfs 節點清單："
        ls -l /dev/binderfs
        
        echo -e "\n2. Docker 容器狀態："
        docker ps -f name=redroid
